name: One-time Groovio experimental publication (owner requested)
# This temporary workflow only runs when the named request file is pushed.
# It calls the same validated shared action as the manual experimental release.
on:
  push:
    branches: [experimental]
    paths:
      - '.github/experimental-release-request-20261120.txt'
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'billyke2000s/Groovio' && github.ref == 'refs/heads/experimental'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GROOVIO_EXPERIMENTAL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/publish
        with:
          changes: |
            Audiobooks and podcasts keep their listening positions more reliably when paused.
            Playing an episode or audiobook no longer automatically bookmarks it.
            Music Home no longer mixes podcasts and audiobooks into its recent shelves.
            Saved items, playback progress and actual downloads are labelled separately.
            Skip unavailable tracks now handles more failed sources across longer queues.
