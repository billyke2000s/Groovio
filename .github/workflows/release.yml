name: Release
# Publishing a GitHub release builds the app at the release's tag, runs the
# tests and attaches the APK to that release.
on:
  release:
    types: [published]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          apk="groovio-${TAG}.apk"
          cp app/build/outputs/apk/debug/*.apk "$apk"
          gh release upload "$TAG" "$apk" --clobber
