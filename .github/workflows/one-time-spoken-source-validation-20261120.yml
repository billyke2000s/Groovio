name: One-time verified spoken-source experiment
on:
  push:
    branches:
      - experimental
    paths:
      - '.github/spoken-source-validation-release-20261120.txt'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'billyke2000s/Groovio' && github.ref == 'refs/heads/experimental'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GROOVIO_EXPERIMENTAL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/publish
        with:
          changes: |
            Podcasts and audiobooks now check that recording streams actually deliver audio data.
            If the media server rejects one source, Groovio tries a different available source.
            Long recordings can try a compatible Android audio source when other options fail.
            Playback errors show the actual HTTP rejection code to help diagnose unavailable recordings.
            Errors from audiobooks no longer appear incorrectly in the Podcasts tab.
