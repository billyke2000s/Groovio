name: Check NewPipe Extractor compatibility
# Daily discovery/testing only. Never modifies main or publishes an APK.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extractor-compatibility-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Look for a newer extractor
        id: check
        shell: bash
        run: |
          latest=$(gh api repos/TeamNewPipe/NewPipeExtractor/releases/latest -q .tag_name)
          current=$(grep -oE 'NewPipeExtractor:v[0-9.]+' app/build.gradle.kts | cut -d: -f2)
          echo "Current: $current | Latest: $latest"
          newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)
          if [ "$latest" = "$current" ] || [ "$newest" != "$latest" ]; then
            echo "Already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if grep -qx "$latest" .github/extractor-blocklist; then
            echo "Candidate $latest is blocklisted; no changes made." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "update=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
      - name: Try candidate in this runner only
        if: steps.check.outputs.update != ''
        shell: bash
        run: |
          sed -i "s/NewPipeExtractor:${{ steps.check.outputs.current }}/NewPipeExtractor:${{ steps.check.outputs.update }}/" app/build.gradle.kts
      - uses: actions/setup-java@v4
        if: steps.check.outputs.update != ''
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.check.outputs.update != ''
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.update != ''
      - name: Test the candidate without publishing
        id: test
        if: steps.check.outputs.update != ''
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Summarise candidate
        if: always() && steps.check.outputs.update != ''
        shell: bash
        run: |
          echo "## NewPipe Extractor compatibility test" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: ${{ steps.check.outputs.update }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Build result: ${{ steps.test.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "No code was pushed and no release was published. Apply and phone-test manually before a release." >> "$GITHUB_STEP_SUMMARY"
