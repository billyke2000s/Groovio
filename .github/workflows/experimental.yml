name: Publish experimental release
# A pushed commit only runs Android CI. A user-facing APK needs a manual release.
on:
  workflow_dispatch:
    inputs:
      changes:
        description: 'What changed for listeners? One plain-English line per feature/fix.'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/experimental'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GROOVIO_EXPERIMENTAL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/publish
        with:
          changes: ${{ inputs.changes }}
