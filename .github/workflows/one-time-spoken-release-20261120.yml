name: One-time approved spoken playback experimental release
on:
  push:
    branches:
      - experimental
    paths:
      - '.github/spoken-release-request-20261120.txt'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'billyke2000s/Groovio' && github.ref == 'refs/heads/experimental'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GROOVIO_EXPERIMENTAL: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/publish
        with:
          changes: |
            Podcasts and audiobooks support more recordings that lack a separate audio stream.
            Episode results no longer wait for optional show and book collection searches.
            More useful playback errors help explain why an episode or audiobook cannot play.
            Groovio keeps audio-only playback even for recordings supplied with video.
